<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0865c9" />
    <meta name="description" content="Apna Campus — Centralized College Management System" />
    <title>Apna Campus — College Management System</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Dancing+Script:wght@600;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
        <div id="root"></div>
    <script>
      window.addEventListener('error', function(event) {
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          root.innerHTML = '<div style="padding:32px;background:#0f172a;color:#f87171;font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center"><div style="background:#1e293b;padding:28px;border-radius:14px;max-width:620px;border:1px solid #450a0a;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5)"><div style=\"color:#ef4444;font-size:20px;font-weight:700;margin-bottom:8px\">Startup Diagnostic</div><p style=\"color:#94a3b8;font-size:14px;margin-bottom:16px\">' + (event.message || 'An error interrupted initialization.') + '</p><pre style=\"background:#090d16;padding:12px;border-radius:8px;overflow:auto;font-size:12px;color:#fca5a5;max-height:200px\">' + (event.error && event.error.stack ? event.error.stack : (event.filename + ':' + event.lineno)) + '</pre><div style=\"display:flex;gap:10px;margin-top:16px\"><button onclick=\"localStorage.clear();sessionStorage.clear();location.reload()\" style=\"background:#2563eb;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer\">Clear Cache & Reload</button><button onclick=\"location.reload()\" style=\"background:#334155;color:#e2e8f0;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer\">Reload</button></div></div></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
