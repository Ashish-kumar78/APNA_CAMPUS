<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="qrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="400" height="400" rx="16" fill="url(#qrBg)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Top-Left Finder Pattern -->
  <rect x="40" y="40" width="70" height="70" rx="8" fill="none" stroke="#1e293b" stroke-width="8"/>
  <rect x="56" y="56" width="38" height="38" rx="4" fill="#1e293b"/>

  <!-- Top-Right Finder Pattern -->
  <rect x="290" y="40" width="70" height="70" rx="8" fill="none" stroke="#1e293b" stroke-width="8"/>
  <rect x="306" y="56" width="38" height="38" rx="4" fill="#1e293b"/>

  <!-- Bottom-Left Finder Pattern -->
  <rect x="40" y="290" width="70" height="70" rx="8" fill="none" stroke="#1e293b" stroke-width="8"/>
  <rect x="56" y="306" width="38" height="38" rx="4" fill="#1e293b"/>

  <!-- Stylized Matrix Grid Dots Placeholder -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="140" cy="50" r="5"/><circle cx="170" cy="50" r="5"/><circle cx="200" cy="50" r="5"/><circle cx="230" cy="50" r="5"/><circle cx="260" cy="50" r="5"/>
    <circle cx="140" cy="80" r="5"/><circle cx="200" cy="80" r="5"/><circle cx="260" cy="80" r="5"/>
    <circle cx="140" cy="110" r="5"/><circle cx="170" cy="110" r="5"/><circle cx="230" cy="110" r="5"/>
    
    <circle cx="50" cy="140" r="5"/><circle cx="80" cy="140" r="5"/><circle cx="110" cy="140" r="5"/><circle cx="290" cy="140" r="5"/><circle cx="320" cy="140" r="5"/><circle cx="350" cy="140" r="5"/>
    <circle cx="50" cy="170" r="5"/><circle cx="110" cy="170" r="5"/><circle cx="290" cy="170" r="5"/><circle cx="350" cy="170" r="5"/>
    <circle cx="50" cy="200" r="5"/><circle cx="80" cy="200" r="5"/><circle cx="110" cy="200" r="5"/><circle cx="290" cy="200" r="5"/><circle cx="320" cy="200" r="5"/><circle cx="350" cy="200" r="5"/>
    <circle cx="50" cy="230" r="5"/><circle cx="110" cy="230" r="5"/><circle cx="290" cy="230" r="5"/><circle cx="350" cy="230" r="5"/>
    <circle cx="50" cy="260" r="5"/><circle cx="80" cy="260" r="5"/><circle cx="110" cy="260" r="5"/><circle cx="290" cy="260" r="5"/><circle cx="320" cy="260" r="5"/><circle cx="350" cy="260" r="5"/>

    <circle cx="140" cy="290" r="5"/><circle cx="170" cy="290" r="5"/><circle cx="230" cy="290" r="5"/><circle cx="260" cy="290" r="5"/><circle cx="320" cy="290" r="5"/>
    <circle cx="140" cy="320" r="5"/><circle cx="200" cy="320" r="5"/><circle cx="260" cy="320" r="5"/><circle cx="350" cy="320" r="5"/>
    <circle cx="140" cy="350" r="5"/><circle cx="170" cy="350" r="5"/><circle cx="200" cy="350" r="5"/><circle cx="230" cy="350" r="5"/><circle cx="260" cy="350" r="5"/>
  </g>

  <!-- Center Placeholder Shield & Notice Badge -->
  <rect x="110" y="140" width="180" height="120" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))"/>
  
  <!-- Campus Icon / Lock -->
  <circle cx="200" cy="175" r="20" fill="#eff6ff"/>
  <path d="M 195 174 L 195 170 C 195 167 197 165 200 165 C 203 165 205 167 205 170 L 205 174 Z" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="193" y="174" width="14" height="11" rx="2" fill="#2563eb"/>

  <!-- Placeholder Notification Text -->
  <text x="200" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">
    OFFICIAL QR CODE
  </text>
  <text x="200" y="226" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb">
    [ PLACEHOLDER ]
  </text>
  <text x="200" y="244" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">
    Awaiting Administrative Upload
  </text>
</svg>
