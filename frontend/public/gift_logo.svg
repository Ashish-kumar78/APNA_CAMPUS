<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Soft shadow for emblem -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Cogwheel Teeth (16 teeth total) -->
  <g transform="translate(100, 100)">
    <!-- Teeth 0 to 4 (Top to Right: Red) -->
    <path d="M-8,-88 L8,-88 L6,-74 L-6,-74 Z" fill="#e53935" />
    <path d="M-8,-88 L8,-88 L6,-74 L-6,-74 Z" transform="rotate(22.5)" fill="#e53935" />
    <path d="M-8,-88 L8,-88 L6,-74 L-6,-74 Z" transform="rotate(45)" fill="#e53935" />
    <path d="M-8,-88 L8,-88 L6,-74 L-6,-74 Z" transform="rotate(67.5)" fill="#e53935" />
    <path d="M-8,-88 L8,-88 L6,-74 L-6,-74 Z" transform="rotate(90)" fill="#e53935" />

    <!-- Teeth 5 to 15 (Bottom-Right, Bottom, Left, Top-Left: Cyan) -->
    <path d="M-8,-88 L8,-88 L6,-74 L-6,-74 Z" transform="rotate(112.5)" fill="#0099e6" />
    <path d="M-8,-88 L8,-88 L6,-74 L-6,-74 Z" transform="rotate(135)" fill="#0099e6" />
    <path d="M-8,-88 L8,-88 L6,-74 L-6,-74 Z" transform="rotate(157.5)" fill="#0099e6" />
    <path d="M-8,-88 L8,-88 L6,-74 L-6,-74 Z" transform="rotate(180)" fill="#0099e6" />
    <path d="M-8,-88 L8,-88 L6,-74 L-6,-74 Z" transform="rotate(202.5)" fill="#0099e6" />
    <path d="M-8,-88 L8,-88 L6,-74 L-6,-74 Z" transform="rotate(225)" fill="#0099e6" />
    <path d="M-8,-88 L8,-88 L6,-74 L-6,-74 Z" transform="rotate(247.5)" fill="#0099e6" />
    <path d="M-8,-88 L8,-88 L6,-74 L-6,-74 Z" transform="rotate(270)" fill="#0099e6" />
    <path d="M-8,-88 L8,-88 L6,-74 L-6,-74 Z" transform="rotate(292.5)" fill="#0099e6" />
    <path d="M-8,-88 L8,-88 L6,-74 L-6,-74 Z" transform="rotate(315)" fill="#0099e6" />
    <path d="M-8,-88 L8,-88 L6,-74 L-6,-74 Z" transform="rotate(337.5)" fill="#0099e6" />

    <!-- Outer Rim Circles -->
    <circle r="75" fill="none" stroke="#0099e6" stroke-width="8" />
    <!-- Red arc accent on upper right rim -->
    <path d="M0,-75 A75,75 0 0,1 75,0" fill="none" stroke="#e53935" stroke-width="8" />
    
    <!-- Inner White Field -->
    <circle r="71" fill="#ffffff" />
    <circle r="68" fill="none" stroke="#0099e6" stroke-width="1.5" />
    
    <!-- Central Lamp (Diya) with Flame in Red -->
    <g transform="translate(0, -32)">
      <!-- Flame -->
      <path d="M0,-14 C-4,-6 -5,0 0,6 C5,0 4,-6 0,-14 Z" fill="#e53935" />
      <path d="M0,-9 C-2,-4 -2,0 0,4 C2,0 2,-4 0,-9 Z" fill="#facc15" />
      <!-- Diya Base / Lamp -->
      <path d="M-14,6 C-14,13 14,13 14,6 C10,7 -10,7 -14,6 Z" fill="#e53935" />
      <path d="M-18,6 Q0,18 18,6 Q9,10 -18,6 Z" fill="#e53935" />
      <line x1="-12" y1="12" x2="12" y2="12" stroke="#e53935" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Acronym Text: GIFT -->
    <text x="0" y="8" font-family="'Arial Black', Arial, sans-serif" font-size="34" font-weight="900" fill="#0099e6" text-anchor="middle" letter-spacing="1">GIFT</text>

    <!-- Open Book Symbol in Red below GIFT -->
    <g transform="translate(0, 32)">
      <!-- Left Page -->
      <path d="M-2,6 Q-14,-2 -26,3 L-26,16 Q-14,11 -2,19 Z" fill="none" stroke="#e53935" stroke-width="2.2" stroke-linejoin="round" />
      <!-- Right Page -->
      <path d="M2,6 Q14,-2 26,3 L26,16 Q14,11 2,19 Z" fill="none" stroke="#e53935" stroke-width="2.2" stroke-linejoin="round" />
      <!-- Spine -->
      <line x1="0" y1="6" x2="0" y2="20" stroke="#e53935" stroke-width="2.2" stroke-linecap="round" />
    </g>
  </g>
</svg>
