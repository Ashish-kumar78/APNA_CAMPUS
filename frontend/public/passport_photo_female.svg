<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 190" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5"/>
      <stop offset="100%" stop-color="#e8b896"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b18"/>
      <stop offset="100%" stop-color="#0f0e0d"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Studio Passport Background -->
  <rect width="160" height="190" fill="url(#bgGrad)"/>

  <!-- Shoulders & Formal Blazer Coat -->
  <path d="M 12 190 C 18 142 50 134 80 134 C 110 134 142 142 148 190 Z" fill="url(#coatGrad)"/>
  
  <!-- White Inner Shirt Collar -->
  <polygon points="80,148 64,130 96,130" fill="#ffffff"/>
  <polygon points="68,130 80,158 72,168 56,132" fill="#f8fafc"/>
  <polygon points="92,130 80,158 88,168 104,132" fill="#f1f5f9"/>

  <!-- Neck -->
  <rect x="71" y="112" width="18" height="26" rx="4" fill="url(#skinGrad)"/>

  <!-- Long Hair Back Drop -->
  <path d="M 46 75 C 44 115 48 148 54 158 C 55 130 52 100 58 85 Z" fill="url(#hairGrad)"/>
  <path d="M 114 75 C 116 115 112 148 106 158 C 105 130 108 100 102 85 Z" fill="url(#hairGrad)"/>

  <!-- Face -->
  <ellipse cx="80" cy="85" rx="27" ry="34" fill="url(#skinGrad)"/>

  <!-- Hair Top & Bangs -->
  <path d="M 52 82 C 50 50 65 38 80 38 C 95 38 110 50 108 82 C 104 64 96 52 80 52 C 64 52 56 64 52 82 Z" fill="url(#hairGrad)"/>
  <path d="M 52 68 C 58 56 70 54 78 58 C 72 58 64 64 60 74 Z" fill="url(#hairGrad)"/>
  <path d="M 108 68 C 102 56 90 54 82 58 C 88 58 96 64 100 74 Z" fill="url(#hairGrad)"/>

  <!-- Eyebrows -->
  <path d="M 62 73 Q 69 70 75 73" stroke="#262320" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 85 73 Q 91 70 98 73" stroke="#262320" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="69" cy="80" rx="3.5" ry="2.5" fill="#1e1b18"/>
  <circle cx="70" cy="79" r="1" fill="#ffffff"/>
  <ellipse cx="91" cy="80" rx="3.5" ry="2.5" fill="#1e1b18"/>
  <circle cx="92" cy="79" r="1" fill="#ffffff"/>

  <!-- Small Bindi -->
  <circle cx="80" cy="72" r="1.2" fill="#be123c"/>

  <!-- Nose -->
  <path d="M 80 80 Q 82 89 79 91 Q 81 92 84 91" stroke="#cb9370" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  <!-- Lips with warm smile -->
  <path d="M 72 99 Q 80 104 88 99" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 74 100 Q 80 106 86 100" stroke="#f43f5e" stroke-width="1" stroke-linecap="round" fill="none"/>

  <!-- Small Ear Studs -->
  <circle cx="53" cy="87" r="1.8" fill="#fbbf24"/>
  <circle cx="107" cy="87" r="1.8" fill="#fbbf24"/>

  <!-- Border photo frame -->
  <rect x="0.5" y="0.5" width="159" height="189" fill="none" stroke="#cbd5e1" stroke-width="1"/>
</svg>
