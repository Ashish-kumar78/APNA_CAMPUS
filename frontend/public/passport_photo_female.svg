<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 190" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="skinGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2c8a2"/>
      <stop offset="100%" stop-color="#e0b085"/>
    </linearGradient>
    <linearGradient id="hairGradM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262320"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
    <linearGradient id="suitGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
  </defs>

  <!-- Studio Passport Background -->
  <rect width="160" height="190" fill="url(#bgGradM)"/>

  <!-- Shoulders & Navy Formal Blazer -->
  <path d="M 8 190 C 14 136 46 128 80 128 C 114 128 146 136 152 190 Z" fill="url(#suitGradM)"/>
  
  <!-- White Shirt Collar -->
  <polygon points="80,146 62,126 98,126" fill="#ffffff"/>
  
  <!-- Maroon College Necktie -->
  <polygon points="76,142 84,142 87,190 73,190" fill="#991b1b"/>
  <polygon points="75,138 85,138 83,148 77,148" fill="#7f1d1d"/>

  <!-- Neck -->
  <rect x="70" y="108" width="20" height="24" rx="4" fill="url(#skinGradM)"/>

  <!-- Face -->
  <path d="M 52 82 C 52 114 64 126 80 126 C 96 126 108 114 108 82 C 108 58 96 52 80 52 C 64 52 52 58 52 82 Z" fill="url(#skinGradM)"/>

  <!-- Male Neat Hair Cut -->
  <path d="M 48 76 C 46 44 64 32 80 32 C 96 32 114 44 112 76 C 108 58 98 46 80 46 C 62 46 52 58 48 76 Z" fill="url(#hairGradM)"/>
  <path d="M 48 74 C 54 58 68 50 82 52 C 94 54 106 60 112 72 C 106 60 92 54 80 54 C 66 54 54 62 48 74 Z" fill="url(#hairGradM)"/>

  <!-- Eyebrows -->
  <path d="M 58 74 Q 67 70 75 73" stroke="#1c1917" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <path d="M 85 73 Q 93 70 102 74" stroke="#1c1917" stroke-width="2.6" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="67" cy="81" rx="3.6" ry="2.6" fill="#1c1917"/>
  <circle cx="68" cy="80" r="1" fill="#ffffff"/>
  <ellipse cx="93" cy="81" rx="3.6" ry="2.6" fill="#1c1917"/>
  <circle cx="94" cy="80" r="1" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M 80 79 Q 83 89 79 92 Q 81 94 85 92" stroke="#b4835c" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Lips -->
  <path d="M 72 102 Q 80 106 88 102" stroke="#9a3412" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Border photo frame -->
  <rect x="0.5" y="0.5" width="159" height="189" fill="none" stroke="#cbd5e1" stroke-width="1"/>
</svg>
